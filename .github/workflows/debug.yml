name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          # Usamos una versión estable y reciente que incluye un SDK de Dart superior a 3.11.0
          flutter-version: '3.29.0'
          channel: 'stable'
          # Desactivamos la caché para asegurar que se instale la versión correcta desde cero
          cache: false

      - run: flutter pub get

      - run: flutter build apk --debug --flavor github

      - uses: actions/upload-artifact@v4
        with:
          name: Melodify-debug
          path: build/app/outputs/flutter-apk/app-github-debug.apk
